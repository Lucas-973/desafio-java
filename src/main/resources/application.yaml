spring:
  application:
    name: portfolio-api
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

app:
  security:
    username: ${APP_USERNAME}
    password: ${APP_PASSWORD}

integrations:
  membros:
    base-url: ${MEMBROS_API_URL:http://localhost:8090}
    connect-timeout: ${MEMBROS_CONNECT_TIMEOUT:2s}
    read-timeout: ${MEMBROS_READ_TIMEOUT:5s}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
